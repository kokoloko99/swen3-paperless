# Beschreibt die öffentlich dokumentierten Dokument-Endpunkte der REST-API.
openapi: 3.0.3
info:
  title: Paperless REST API
  description: REST API for the "Document Upload" use case.
  version: 1.0.0
  # URL versioning: the major version is part of the path (/api/v1)
servers:
  - url: http://localhost:8080
# Verlangt einen Bearer-Token für die beschriebenen Anfragen.
security:
  - bearerAuth: []
paths:
  # Beschreibt den Upload einer Datei als Multipart-Anfrage.
  /api/v1/documents:
    post:
      summary: Upload a document
      operationId: uploadDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Invalid request (e.g. missing file)
  # Beschreibt das Lesen der Dokumentmetadaten über die Dokument-ID.
  /api/v1/documents/{id}:
    delete:
      summary: Delete a document and all its comments
      operationId: deleteDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Document and comments deleted (also returned if already absent)
        '400':
          description: Invalid document ID
        '401':
          description: Authentication required
        '503':
          description: Document storage unavailable
    get:
      summary: Get document metadata
      operationId: getDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          description: Document not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  # Legt die Felder der zurückgegebenen Dokumentdaten fest.
  schemas:
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        contentType:
          type: string
        size:
          type: integer
          format: int64
        uploadedAt:
          type: string
          format: date-time
