<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paperless</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<header>
    <h1>Paperless</h1>
    <button id="logout" type="button">Abmelden</button>
</header>
<main id="app" hidden>
    <section>
        <h2>Dokument hochladen</h2>
        <form id="upload-form">
            <input type="file" id="file" required>
            <button type="submit">Hochladen</button>
        </form>
    </section>

    <section>
        <h2>Dokumente</h2>
        <form id="lookup-form">
            <input type="text" id="lookup-id" placeholder="Dokument-ID" required>
            <button type="submit">Laden</button>
        </form>
        <ul id="document-list"></ul>
    </section>

    <section id="detail" hidden>
        <h2>Details</h2>
        <dl id="meta"></dl>

        <h3>Kommentare</h3>
        <ul id="comments"></ul>
        <form id="comment-form">
            <input type="text" id="author" placeholder="Autor" required>
            <input type="text" id="text" placeholder="Kommentar" maxlength="1000" required>
            <button type="submit">Hinzufügen</button>
        </form>
    </section>

    <p id="message" role="status"></p>
</main>
<script src="app.js?v=2"></script>
</body>
</html>
