server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        client_max_body_size 50m;
        proxy_pass http://rest:8080;
        proxy_set_header Host $host;
    }
}