# Liefert die Frontend-Dateien aus und leitet API-Anfragen an das Backend weiter.
server {
    listen 80;
    server_name localhost;

    # Hier liegen die HTML-, CSS- und JavaScript-Dateien im Container.
    root /usr/share/nginx/html;
    index index.html;

    # Liefert vorhandene Dateien aus und antwortet sonst mit Status 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Leitet alle Anfragen mit /api/ an den REST-Container weiter.
    location /api/ {
        # Erlaubt bei NGINX Anfragen bis 50 MB; das Backend hat ein eigenes Limit.
        client_max_body_size 50m;
        proxy_pass http://rest:8080;
        # Gibt den ursprünglichen Hostnamen an das Backend weiter.
        proxy_set_header Host $host;
    }
}