# Legt den Namen fest, der auch in den Worker-Logs erscheint.
spring.application.name=paperless-ocr-worker
# Startet den Worker ohne eigenen HTTP-Webserver.
spring.main.web-application-type=none
# Verbindet den Worker mit RabbitMQ; Docker Ã¼berschreibt den Hostnamen.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=paperless
spring.rabbitmq.password=paperless
# BestÃ¤tigt eine Nachricht, nachdem die Verarbeitung erfolgreich zurÃ¼ckgekehrt ist.
spring.rabbitmq.listener.simple.acknowledge-mode=auto
# HÃ¤lt pro Consumer hÃ¶chstens eine unbestÃ¤tigte Nachricht gleichzeitig bereit.
spring.rabbitmq.listener.simple.prefetch=1
# Verwendet dieselbe Queue wie der Publisher im REST-Server.
paperless.ocr.queue=paperless.ocr.v4

paperless.minio.url=http://localhost:9000
paperless.minio.access-key=${MINIO_ROOT_USER:paperless}
paperless.minio.secret-key=${MINIO_ROOT_PASSWORD:paperless-secret}
paperless.minio.bucket=documents
paperless.elasticsearch.url=http://localhost:9200
paperless.elasticsearch.index=paperless-documents
paperless.ocr.languages=eng+deu
# Bound transient retries; retain exhausted and invalid messages for inspection.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.multiplier=2
