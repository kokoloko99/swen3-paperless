spring.application.name=paperless-rest

spring.datasource.url=jdbc:postgresql://localhost:5434/paperless
spring.datasource.username=paperless
spring.datasource.password=paperless
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8082/realms/paperless/protocol/openid-connect/certs
