# Legt den Namen der REST-Anwendung fest.
spring.application.name=paperless-rest
# Local IDE runs use 8083; Docker Compose overrides this with SERVER_PORT=8080.
server.port=8083

# Verbindet lokale Starts mit RabbitMQ und wartet beim Senden auf Bestätigungen.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=paperless
spring.rabbitmq.password=paperless
spring.rabbitmq.publisher-confirm-type=simple
# Verwendet dieselbe OCR-Queue wie der Worker.
paperless.ocr.queue=paperless.ocr.v5

# Verbindet lokale Starts mit PostgreSQL auf dem freigegebenen Docker-Port 5434.
spring.datasource.url=jdbc:postgresql://localhost:5434/paperless
spring.datasource.username=paperless
spring.datasource.password=paperless
spring.datasource.driver-class-name=org.postgresql.Driver

# Prüft das Datenbankschema; Änderungen werden durch Flyway vorgenommen.
spring.jpa.hibernate.ddl-auto=validate

# Verhindert technische Fehlerdetails in den allgemeinen Fehlerantworten.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# Lädt die öffentlichen Schlüssel von Keycloak zur Prüfung der JWT-Signatur.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8082/realms/paperless/protocol/openid-connect/certs

paperless.minio.url=http://localhost:9000
paperless.minio.access-key=${MINIO_ROOT_USER:paperless}
paperless.minio.secret-key=${MINIO_ROOT_PASSWORD:paperless-secret}
paperless.minio.bucket=documents
