// Aktiviert Java, Spring Boot, die Versionsverwaltung der Abhängigkeiten und die Testabdeckung.
plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'at.fhtw.swen3'
version = '0.3.0'

// Verwendet Java 21 zum Kompilieren.
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// Lädt die benötigten Bibliotheken aus Maven Central.
repositories {
	mavenCentral()
}

// Bindet Bibliotheken für API, Datenbank, Sicherheit, RabbitMQ und Tests ein.
dependencies {
    implementation 'io.minio:minio:8.5.17'
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	runtimeOnly 'org.postgresql:postgresql'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
	testImplementation 'org.testcontainers:postgresql:1.21.4'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	testAnnotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
}

// Führt die JUnit-Tests aus und erstellt danach den Bericht zur Testabdeckung.
tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

// Erstellt die Berichte zur Testabdeckung als HTML und XML.
tasks.named('jacocoTestReport') {
	reports {
		xml.required = true
		html.required = true
	}
}

// Sprint 4: enforce more than 70 percent line coverage.
jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit { counter = 'LINE'; minimum = 0.71 }
        }
    }
}
check.dependsOn jacocoTestCoverageVerification
